name: Release Build

# Publishes container images for every service in service-map.yaml.
#
#   push to release/X.Y   -> :<short-sha>
#   push of tag vX.Y.Z    -> :<short-sha>, :vX.Y.Z, :vX.Y
#   push of tag vX.Y.Z-rc1 -> :<short-sha>, :vX.Y.Z-rc1  (no line tag)
#   workflow_dispatch     -> :<short-sha>, optionally a subset of services
#
# A published vX.Y.Z tag is never re-pointed; a bad release is superseded by
# the next patch. See docs/tech-docs/release-management.md.
#
# Alongside the images, every run builds odo-register as a static binary for
# x86_64 and aarch64. A tag push attaches those to the GitHub Release, so a
# host that only runs k3s can fetch the tool (scripts/fetch-odo-register.sh)
# instead of carrying a Rust toolchain to build it.
#
# Deployment is deliberately out of scope: this repository publishes images and
# manifests, and a private per-installation repository decides what runs where.

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build (default: all)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  # Each project owns its own GHCR namespace -- ghcr.io/<owner>/<repo>/<service>
  # -- so image names never collide between repositories that ship a service of
  # the same name.
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  plan:
    name: Plan Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      services: ${{ steps.plan.outputs.services }}
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/bin/yq

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="${{ github.ref_name }}"

          # Semver build metadata is a legal git tag but not a legal image
          # tag, so catch it here rather than deep in an opaque push error.
          if [[ "$TAG" == *+* ]]; then
            echo "::error::Tag '$TAG' contains '+': semver build metadata is not a legal container image tag. Use a '-' prerelease suffix instead."
            exit 1
          fi

          # vX.Y.Z, optionally with a prerelease suffix (v1.2.3-rc1).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a vX.Y.Z or vX.Y.Z-suffix release tag"
            exit 1
          fi

          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=true" >> $GITHUB_OUTPUT

          # A suffixed tag is a prerelease: it publishes its own full tag but
          # must never move the vX.Y line tag, which means "newest released
          # patch on this line".
          if [[ -n "${BASH_REMATCH[1]}" ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "Prerelease $TAG: no vX.Y line tag will be moved."
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Select services
        id: plan
        run: |
          # A release build is whole: every service, so a version tag names a
          # coherent set of images. The subset input exists only to re-run a
          # single service after an infrastructure failure.
          REQUESTED="${{ github.event.inputs.services }}"

          if [[ -n "$REQUESTED" ]]; then
            SERVICES=$(echo "$REQUESTED" | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$' | jq -R . | jq -s -c .)

            # Fail loudly on a typo rather than silently building nothing.
            for service in $(echo "$SERVICES" | jq -r '.[]'); do
              if [[ "$(yq eval ".services | has(\"$service\")" service-map.yaml)" != "true" ]]; then
                echo "::error::Unknown service '$service' (not in service-map.yaml)"
                exit 1
              fi
            done
          else
            SERVICES=$(yq eval '.services | keys' service-map.yaml -o json | jq -c .)
          fi

          MATRIX=$(yq eval -o json '.services' service-map.yaml \
            | jq -c --argjson want "$SERVICES" '
                to_entries
                | map(select(.key as $k | $want | index($k)))
                | map({name: .key, dockerfile: .value.build.dockerfile,
                       context: (.value.build.context // ".")})
                | {include: .}')

          if [[ "$(echo "$MATRIX" | jq '.include | length')" == "0" ]]; then
            echo "::error::No services resolved to build"
            exit 1
          fi

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building: $SERVICES"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          # GHCR rejects uppercase in a path; a fork under a mixed-case owner
          # would otherwise fail the push with an obscure error.
          PREFIX=$(echo "${{ env.IMAGE_PREFIX }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${PREFIX}/${{ matrix.name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Always published. It names the commit, not a fixed image: a rebuild
          # of the same commit produces a new digest and moves this tag.
          TAGS="${IMAGE}:${SHORT_SHA}"

          if [[ "${{ needs.plan.outputs.is-release }}" == "true" ]]; then
            VERSION="${{ needs.plan.outputs.version }}"        # vX.Y.Z[-suffix]
            TAGS="${TAGS}"$'\n'"${IMAGE}:${VERSION}"

            # Only a plain vX.Y.Z moves the line tag. ${VERSION%.*} would
            # derive "v0.1" from "v0.1.0-rc1" and quietly point the stable
            # line at a prerelease.
            if [[ "${{ needs.plan.outputs.is-prerelease }}" != "true" ]]; then
              LINE="${VERSION%.*}"                             # vX.Y
              TAGS="${TAGS}"$'\n'"${IMAGE}:${LINE}"
            fi
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          # head_commit is absent on workflow_dispatch, so stamp the build here.
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          echo "Tags:"
          echo "$TAGS"

      - name: Build and push service image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TAG=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.date }}
            BUILD_COMMIT=${{ github.sha }}
            VERSION=${{ needs.plan.outputs.version }}

  odo-register:
    name: Build odo-register (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest so both rows build on the same
        # release and the job does not move when the latest label does.
        # Nothing from the runner ends up in a static musl binary anyway.
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust/odo-register
          key: ${{ matrix.target }}

      # musl links statically with no C dependencies to satisfy: odo-register
      # is reqwest without TLS (it talks to the gateway on localhost), serde
      # and tokio. The result runs on any Linux of the same architecture.
      - name: Build
        env:
          ODO_REGISTER_BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd src/rust/odo-register
          cargo build --release --locked --target "${{ matrix.target }}"

          bin="target/${{ matrix.target }}/release/odo-register"
          file "$bin"
          # rustc emits a static-pie for musl; file reports that as
          # "static-pie linked", older toolchains as "statically linked".
          if ! file "$bin" | grep -Eq 'static(ally|-pie) linked'; then
            echo "::error::odo-register is not statically linked" >&2
            exit 1
          fi

          # The stamp is what the fetch script checks the download against.
          "$bin" --version
          [ "$("$bin" --version)" = "odo-register $ODO_REGISTER_BUILD_VERSION" ]

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$bin" "$GITHUB_WORKSPACE/dist/odo-register-${{ matrix.target }}"

      # Handed to the release job; on a non-release run this is the only
      # place the binary lands, and a week is plenty for a smoke test.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: odo-register-${{ matrix.target }}
          path: dist/odo-register-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: [plan, build, odo-register]
    # Only after the images and binaries exist: a release entry announcing
    # a version whose build failed is worse than no entry.
    if: needs.plan.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: gh works from GH_REPO. Deployment repositories read
      # k8s/ and openapi/ as a kustomize remote base pinned to this tag, so
      # the manifests are not packaged; the only assets are the odo-register
      # binaries, for hosts with no toolchain.
      - name: Collect odo-register binaries
        uses: actions/download-artifact@v4
        with:
          pattern: odo-register-*
          path: dist
          merge-multiple: true

      - name: Checksum the assets
        run: |
          cd dist
          chmod 0755 odo-register-*
          sha256sum odo-register-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.is-prerelease }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Notes someone edited stay as they are. Assets are only added
            # where missing, never replaced: a re-run of the same commit
            # produces a different binary, and a downloaded checksum must
            # keep matching what the release served before.
            echo "Release $VERSION already exists; leaving notes alone."
            existing="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
            for f in dist/*; do
              if grep -qxF "$(basename "$f")" <<<"$existing"; then
                echo "  asset $(basename "$f") already present"
              else
                gh release upload "$VERSION" "$f"
                echo "  uploaded $(basename "$f")"
              fi
            done
            exit 0
          fi

          # --prerelease keeps a suffixed tag from being presented as the
          # latest release, matching the rule that it never moves vX.Y.
          args=(--verify-tag --generate-notes --title "$VERSION")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$VERSION" "${args[@]}" dist/*

  summary:
    name: Build Summary
    needs: [plan, build, odo-register]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 📦 Release Build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Version | \`${{ needs.plan.outputs.version }}\` |"
            echo "| Release tag | ${{ needs.plan.outputs.is-release }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Images | ${{ needs.build.result }} |"
            echo "| odo-register | ${{ needs.odo-register.result }} |"
            echo
            echo "**Services**"
            echo '```json'
            # Empty when the plan job itself failed; don't fail the summary.
            echo '${{ needs.plan.outputs.services }}' | jq . 2>/dev/null \
              || echo '(planning failed)'
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
