name: OpenAPI Spec Drift Check

# The committed openapi/*.json specs are the source of truth for the admin
# UI's generated TypeScript types. This job fails if the specs a service
# would emit differ from what's committed, so a Rust API change can't merge
# without regenerating the specs (and the generated types).

on:
  push:
    branches:
      - 'main'
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  openapi-drift:
    name: Check committed OpenAPI specs are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # generate-openapi.sh also regenerates the admin UI's TypeScript types
      # via `npx openapi-typescript`, so the job needs a pinned Node.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/rust/odo-auth
            src/rust/odo-org
            src/rust/odo-notify
            src/rust/odo-asset

      - name: Verify OpenAPI specs are up to date
        run: ./scripts/generate-openapi.sh --check
