# service-map.yaml
#
# language:
#   - the programming language/framework of the service (rust, node, etc.)
#
# database (optional): the project's own database, for the shared database
# scripts (common.sh load_db_config, run-db-tests.sh).
#   namespace, secret: the Kubernetes secret holding DATABASE_URL
#   tests: glob of pgTAP test files under tests/db (default: *.sql)
#
database:
  namespace: odo-core
  secret: postgres-credentials
  # tests/db/seed/ holds helpers that tests include, not tests.
  tests: odo/*.sql

services:

  odo-auth:
    language: rust
    namespace: odo-pub
    build:
      dockerfile: src/rust/odo-auth/Dockerfile
      context: .

  odo-org:
    language: rust
    namespace: odo-pub
    build:
      dockerfile: src/rust/odo-org/Dockerfile
      context: .

  odo-notify:
    language: rust
    namespace: odo-pub
    build:
      dockerfile: src/rust/odo-notify/Dockerfile
      context: .

  odo-asset:
    language: rust
    namespace: odo-pub
    build:
      dockerfile: src/rust/odo-asset/Dockerfile
      context: .

  # ODO admin UI (served at /odo/admin)
  ui-odo-admin:
    language: node
    namespace: odo-pub
    build:
      dockerfile: src/ui/odo-admin/Dockerfile
      context: .
