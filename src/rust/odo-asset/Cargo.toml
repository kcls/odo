[package]
name = "odo-asset"
version = "0.1.0"
edition = "2024"

[dependencies]
odo-client = { path = "../odo-client" }
odo-service = { path = "../odo-service" }
odo-entity = { path = "../odo-entity" }

sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }

axum = { version = "0.8", features = ["multipart"] }
utoipa = { version = "5", features = ["axum_extras"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["kv_serde"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
rand = "0.9"
hex = "0.4"

[[bin]]
name = "odo-asset"
path = "src/bin/odo-asset.rs"
