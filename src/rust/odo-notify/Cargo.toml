[package]
name = "odo-notify"
version = "0.1.0"
edition = "2024"

[dependencies]
odo-client = { path = "../odo-client" }
odo-service = { path = "../odo-service" }
odo-entity = { path = "../odo-entity" }

sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }

axum = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["kv_serde"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
rand = "0.9"

[[bin]]
name = "odo-notify"
path = "src/bin/odo-notify.rs"
