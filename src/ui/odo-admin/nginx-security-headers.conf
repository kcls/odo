# Security headers for every odo-admin response. Included at server level
# AND in each location that sets its own add_header: nginx drops all
# inherited add_header directives in a block that declares any.
#
# The CSP assumes the API is same-origin, as it is behind the gateway. An
# image built with VITE_API_HOSTPORT pointing elsewhere needs that origin
# in connect-src. style-src allows inline styles: Radix, Recharts and the
# shadcn chart set style attributes and a <style> element at runtime.
# Trusted Types is left off, since React's dangerouslySetInnerHTML (the
# chart's <style>) would need a policy.
#
# srcdoc iframes inherit this policy, so the email previews also cannot
# load remote resources.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
