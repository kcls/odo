<h1 i18n="Landing page heading">Administration</h1>
<p class="home-intro" i18n="Landing page introduction">
  Manage system configuration. Tools you have access to appear below.
</p>

<div class="home-grid">
  @for (tool of tools(); track tool.path) {
    <mat-card appearance="outlined" class="home-card" [routerLink]="['/', tool.path]">
      <mat-card-header>
        <mat-icon mat-card-avatar>{{ tool.icon }}</mat-icon>
        <mat-card-title>{{ tool.label }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ tool.description }}</p>
      </mat-card-content>
    </mat-card>
  }
</div>
