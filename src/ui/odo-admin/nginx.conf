# Define JSON log format
log_format json_access escape=json '{'
    '"time_iso8601":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"host":"$host"'
'}';

# Conditional logging - skip kube-probe requests
map $http_user_agent $loggable {
    ~*kube-probe 0;
    default 1;
}

# Angular's application builder emits content-hashed bundles at the root of
# the output directory (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-*.css),
# not under a subdirectory, so a prefix location can't pick them out. Match
# the hash suffix instead and mark those immutable. An empty value means
# nginx omits the header entirely, so index.html and unhashed files are
# untouched.
map $uri $immutable_asset {
    # Quoted: nginx would otherwise read the {8,} quantifier as a block.
    "~*-[A-Za-z0-9_-]{8,}\.(?:js|css)$"  "public, max-age=31536000, immutable";
    default                              "";
}

server {
    listen 8080;
    server_name localhost;

    access_log /var/log/nginx/access.log json_access if=$loggable;
    error_log /var/log/nginx/error.log warn;

    # Disable port in redirects when behind a proxy
    port_in_redirect off;

    # Trust proxy headers for proper URL generation
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA entry point so deploys take effect immediately
    location = /odo/admin/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    # Angular emits fonts/images under media/
    location /odo/admin/media/ {
        alias /usr/share/nginx/html/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /odo/admin {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /odo/admin/index.html;
        add_header Cache-Control $immutable_asset;
    }

    error_page 404 /odo/admin/index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/x-icon;
}
