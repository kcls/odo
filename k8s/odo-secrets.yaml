# Kubernetes secrets for all services.
#
# Apply once to bootstrap a cluster.  After initial setup, use
# ./scripts/manage-secrets.sh to update individual secrets — it
# handles copying across namespaces automatically.
#
# CHANGE ALL VALUES BEFORE DEPLOYING TO PRODUCTION.

# ---------------------------------------------------------------------------
# PostgreSQL credentials
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: odo-core
type: Opaque
stringData:
  DATABASE_URL: "postgres://odo:demo123@postgres.odo-core.svc.cluster.local:5432/odo?sslmode=disable"
  # Host-reachable endpoint for dev tooling (manage-database.sh, test
  # runners) - same credentials, resolved outside the cluster network.
  # localhost:32345 is the containerized postgres NodePort (see
  # k8s/infrastructure/postgres/service.yaml); the install script patches
  # this to match the actual deployment mode.
  EXTERNAL_DATABASE_URL: "postgres://odo:demo123@localhost:32345/odo?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: odo-pub
type: Opaque
stringData:
  DATABASE_URL: "postgres://odo:demo123@postgres.odo-core.svc.cluster.local:5432/odo?sslmode=disable"
  # Host-reachable endpoint for dev tooling (manage-database.sh, test
  # runners) - same credentials, resolved outside the cluster network.
  # localhost:32345 is the containerized postgres NodePort (see
  # k8s/infrastructure/postgres/service.yaml); the install script patches
  # this to match the actual deployment mode.
  EXTERNAL_DATABASE_URL: "postgres://odo:demo123@localhost:32345/odo?sslmode=disable"
---
# ---------------------------------------------------------------------------
# JWT — odo-auth (RS256)
# Used by odo-auth (private + public) and odo-org (public only).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: odo-jwt-secret
  namespace: odo-pub
type: Opaque
stringData:
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
---
# ---------------------------------------------------------------------------
# Notify service account (background-job enqueue)
# Shared low-privilege machine account used by application background jobs
# (e.g. the draft-reminder scan) to authenticate to odo-notify via /login.
# The password below MUST match the bcrypt hash seeded by migration
# the platform seed (dev-only default).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: odo-notify-service-account
  namespace: odo-pub
type: Opaque
stringData:
  username: odo-notify-service
  password: odo-notify-service-dev-only
---
# ---------------------------------------------------------------------------
# SMTP notification settings
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: notification-smtp
  namespace: odo-pub
  labels:
    app: notification
    part-of: odo
type: Opaque
stringData:
  smtp-host: localhost
  # 1025 is the default port for mailhog (testing)
  smtp-port: "1025"
  smtp-username: ""
  smtp-password: ""
  smtp-from-email: odo-notifier@localhost
  smtp-from-name: Odo Notifier
  smtp-use-tls: "false"
  smtp-use-starttls: "false"
  smtp-dangerous-accept-invalid-certs: "false"
