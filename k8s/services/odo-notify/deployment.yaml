apiVersion: apps/v1
kind: Deployment
metadata:
  name: odo-notify
  namespace: odo-pub
  labels:
    app: odo-notify
    part-of: odo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odo-notify
  template:
    metadata:
      labels:
        app: odo-notify
        part-of: odo
        version: v1
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: odo-notify
        image: localhost:32000/odo-notify:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: ODO_AUTH_URL
          value: "http://odo-auth.odo-pub.svc.cluster.local:8080"
        - name: LOG_LEVEL
          value: "info"
        - name: ODO_LOG_HTTP_REQUEST_BODY
          value: "false"
        - name: K8S_SERVICE
          value: "odo-notify"
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: odo-jwt-secret
              key: JWT_PUBLIC_KEY
        - name: QUEUE_POLL_INTERVAL
          value: "10"
        - name: QUEUE_BATCH_SIZE
          value: "5"
        - name: PROCESSOR_LEASE_DURATION_SECS
          value: "300"
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-host
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-port
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-username
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-password
              optional: true
        - name: SMTP_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-from-email
        - name: SMTP_FROM_NAME
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-from-name
        - name: SMTP_USE_TLS
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-use-tls
        - name: SMTP_USE_STARTTLS
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-use-starttls
        - name: SMTP_DANGEROUS_ACCEPT_INVALID_CERTS
          valueFrom:
            secretKeyRef:
              name: notification-smtp
              key: smtp-dangerous-accept-invalid-certs
              optional: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
