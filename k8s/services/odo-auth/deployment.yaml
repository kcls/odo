apiVersion: apps/v1
kind: Deployment
metadata:
  name: odo-auth
  namespace: odo-pub
  labels:
    app: odo-auth
    part-of: odo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odo-auth
  template:
    metadata:
      labels:
        app: odo-auth
        part-of: odo
        version: v1
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: odo-auth
        image: localhost:32000/odo-auth:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: ODO_LOG_HTTP_REQUEST_BODY
          value: "false"
        - name: K8S_SERVICE
          value: "odo-auth"
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: odo-jwt-secret
              key: JWT_PRIVATE_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: odo-jwt-secret
              key: JWT_PUBLIC_KEY
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: "10"
        - name: REFRESH_TOKEN_EXPIRE_DAYS
          value: "7"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
